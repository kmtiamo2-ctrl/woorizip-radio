name: 설치 파일 만들기
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: { contents: write, issues: write }

jobs:
  windows:
    name: Windows 설치 파일 (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r pc/requirements.txt pyinstaller
      - run: echo '__version__ = "v${{ github.run_number }}"' > pc/version.py
      - name: 실제로 띄워서 점검 (같은 컴퓨터에 서버를 켜고 PC 프로그램의 창·문자·확인 표시·예약을 눌러 봄)
        shell: bash
        env: { PYTHONIOENCODING: utf-8, PYTHONUTF8: "1", FAMILY_KEY: "105403" }
        run: |
          mkdir -p pcout
          export DATA_DIR="$RUNNER_TEMP"
          GITHUB_REPO= python -u server/server.py > pcout/server.out 2> pcout/server.log &
          SRV=$!
          sleep 3
          python pc/radio_pc.py --selftest 2>&1 | tee pcout/selftest.log
          RC=${PIPESTATUS[0]}
          kill $SRV 2>/dev/null || true
          echo "--- 서버 기록 ---"; cat pcout/server.log 2>/dev/null || true
          if [ "$RC" != "0" ]; then echo "::error title=PC 자가 점검 실패::$(grep FAIL pcout/selftest.log | tr '\n' ' ' | cut -c1-800)"; fi
          exit $RC
      - name: 점검에 실패하면 내용을 이슈로 남김
        if: failure()
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo '```'; cat pcout/selftest.log 2>/dev/null | tail -150; echo; echo "--- 서버 기록 ---"; tail -40 pcout/server.log 2>/dev/null; echo; echo "--- 설치·교체 점검 ---"; cat pcout/install.log 2>/dev/null | tail -60; echo '```'; } > body.md
          gh issue create --title "PC 자가 점검 실패 (${{ github.run_number }})" --body-file body.md
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name "WoorizipRadio" --icon pc/icon.ico --collect-all winotify --collect-all pystray --collect-all customtkinter pc/radio_pc.py
      - name: 실제 exe로 설치·교체 흐름 점검 (내려받은 파일 실행 → 자가 설치 → 새 파일로 교체 → 종료)
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Continue'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'la'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'ra'
          New-Item -ItemType Directory -Force (Join-Path $env:APPDATA 'WoorizipRadio') | Out-Null
          Set-Content -Encoding UTF8 (Join-Path $env:APPDATA 'WoorizipRadio\config.json') '{"host":"127.0.0.1","out_host":"","name":"아빠","key":"105403","autostart":false}'
          $inst = Join-Path $env:LOCALAPPDATA 'WoorizipRadio\WoorizipRadio.exe'
          $log = @()
          Copy-Item dist\WoorizipRadio.exe (Join-Path $env:RUNNER_TEMP 'dl1.exe')
          Start-Process (Join-Path $env:RUNNER_TEMP 'dl1.exe') -ArgumentList '--minimized'
          Start-Sleep 20
          $p1 = @(Get-Process WoorizipRadio -ErrorAction SilentlyContinue)
          $log += "1) 내려받은 파일 실행 → 설치본 존재: $(Test-Path $inst) / 실행 중: $($p1.Count)개 / 경로: $(($p1 | ForEach-Object { $_.Path }) -join ' , ')"
          Copy-Item dist\WoorizipRadio.exe (Join-Path $env:RUNNER_TEMP 'dl2.exe')
          Start-Process (Join-Path $env:RUNNER_TEMP 'dl2.exe') -ArgumentList '--minimized','--updated'
          Start-Sleep 25
          $p2 = @(Get-Process WoorizipRadio -ErrorAction SilentlyContinue)
          $log += "2) 새 파일로 교체 실행 → 실행 중: $($p2.Count)개 / 경로: $(($p2 | ForEach-Object { $_.Path }) -join ' , ')"
          python -c "import socket; s=socket.create_connection(('127.0.0.1',47651),timeout=3); s.sendall(b'quit'); s.close()"
          Start-Sleep 8
          $p3 = @(Get-Process WoorizipRadio -ErrorAction SilentlyContinue)
          $log += "3) 종료 요청 → 실행 중: $($p3.Count)개"
          $okPaths = ($p2.Count -gt 0) -and (($p2 | Where-Object { $_.Path -ne $inst }).Count -eq 0)
          $pass = (Test-Path $inst) -and ($p1.Count -ge 1) -and ($p2.Count -ge 1) -and $okPaths -and ($p3.Count -eq 0)
          $log += "결과: " + $(if ($pass) { "통과" } else { "실패" })
          $log += "--- 기록 파일 ---"
          $log += (Get-Content (Join-Path $env:APPDATA 'WoorizipRadio\log.txt') -ErrorAction SilentlyContinue)
          $log | Out-File -Encoding utf8 pcout/install.log
          $log | Write-Host
          if (-not $pass) { Get-Process WoorizipRadio -ErrorAction SilentlyContinue | Stop-Process -Force; Write-Host "::error title=설치·교체 점검 실패::$($log[0..3] -join ' | ')"; exit 1 }
      - run: Copy-Item dist/WoorizipRadio.exe pcout/
      - uses: actions/upload-artifact@v4
        with:
          name: pc
          path: pcout/

  android:
    name: 안드로이드 앱 (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: 빌드
        id: build
        run: chmod +x gradlew && (./gradlew assembleRelease --no-daemon --stacktrace -PappVersion=v${{ github.run_number }} -PappVersionCode=${{ github.run_number }} 2>&1 | tee build.log; exit ${PIPESTATUS[0]})
        working-directory: android
      - name: 실패하면 오류 내용을 이슈로 남김
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo '```'; grep -E "^e: |error:|What went wrong|Could not|Unresolved|FAILURE|Caused by" android/build.log | head -80; echo; echo "--- 마지막 60줄 ---"; tail -60 android/build.log; echo '```'; } > body.md
          gh issue create --title "안드로이드 빌드 실패 (${{ github.run_number }})" --body-file body.md
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/app-release.apk

  release:
    name: 내려받기 페이지 만들기
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - run: |
          mv out/pc/WoorizipRadio.exe out/WoorizipRadio-PC-v${{ github.run_number }}.exe
          mv out/apk/app-release.apk out/WoorizipRadio-Phone-v${{ github.run_number }}.apk
      - uses: actions/checkout@v4
        with: { path: src }
      - name: 릴리스 만들기
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          N=${{ github.run_number }}
          printf '%s\n' "- **PC(Windows)**: \`WoorizipRadio-PC-v$N.exe\` 를 내려받아 더블클릭. 스스로 사용자 폴더에 설치되므로 내려받은 파일은 지워도 돼요" \
                         "- **폰(안드로이드)**: \`WoorizipRadio-Phone-v$N.apk\` 를 폰으로 보내서 설치 (기존 앱 위에 덮어 설치됨)" \
                         "" "<details><summary>PC 프로그램 자동 점검 결과</summary>" "" '```' > notes.md
          cat out/pc/selftest.log >> notes.md 2>/dev/null || echo "(점검 기록 없음)" >> notes.md
          { echo; echo "--- 실제 exe 설치·교체 점검 ---"; cat out/pc/install.log 2>/dev/null | grep -v "^$" | head -12; } >> notes.md
          printf '%s\n' '```' "</details>" >> notes.md
          set +e
          gh release create "v$N" out/*.exe out/*.apk --repo "$GITHUB_REPOSITORY" --title "우리집 무전기 v$N" --notes-file notes.md --latest > release.log 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "::error title=release::$(tr '\n' ' ' < release.log | cut -c1-900)"
            echo "::error title=files::$(ls -R out | tr '\n' ' ' | cut -c1-500)"
            echo "::error title=auth::$(gh api repos/$GITHUB_REPOSITORY --jq '.permissions' 2>&1 | tr '\n' ' ' | cut -c1-300)"
          fi
          exit $RC
      - name: 실패하면 이슈로 남김
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "릴리스 만들기 실패 ($(date +%H:%M))" --body "$(ls -R out; cat release.log 2>/dev/null)"
