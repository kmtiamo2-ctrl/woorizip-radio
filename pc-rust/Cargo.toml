[package]
name = "woorizip-pc"
version = "0.1.0"
edition = "2021"
description = "우리집 가족 무전기 — PC 프로그램 (Rust판)"
license = "MIT"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hostname = "0.4"
ureq = { version = "2", default-features = false, features = ["tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
open = "5"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
eframe = { version = "0.32", default-features = false, features = ["glow", "wgpu", "default_fonts", "x11", "wayland"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.16"
rfd = { version = "0.15", default-features = false }
arboard = { version = "3", default-features = false }
tray-icon = "0.21"
rdev = "0.5"
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
