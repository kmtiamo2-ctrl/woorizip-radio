[package]
name = "woorizip-pc"
version = "0.1.0"
edition = "2021"
description = "우리집 가족 무전기 — PC 프로그램 (Rust판)"
license = "MIT"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hostname = "0.4"
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.16"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
