name: 설치 파일 만들기
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: Windows 설치 파일 (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r pc/requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name "우리집무전기" pc/radio_pc.py
      - uses: actions/upload-artifact@v4
        with:
          name: PC용-우리집무전기
          path: dist/우리집무전기.exe

  android:
    name: 안드로이드 앱 (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: 폰용-우리집무전기
          path: android/app/build/outputs/apk/release/app-release.apk
